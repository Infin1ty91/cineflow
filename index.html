<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(180deg,#07122c,#0f172a);
    color:white;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.hero{
    text-align:center;
    padding:90px 20px;
}

.hero h1{
    font-size:72px;
    margin-bottom:15px;
}

.hero p{
    font-size:24px;
    color:#cbd5e1;
}

.tagline{
    max-width:850px;
    margin:40px auto;
    line-height:1.8;
    color:#dbeafe;
    font-size:20px;
}

.section{
    margin-top:80px;
}

.section h2{
    text-align:center;
    margin-bottom:30px;
    font-size:38px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#111827;
    border-radius:16px;
    padding:25px;
    text-align:center;
}

.card h3{
    margin-bottom:10px;
}

.search-container{
    background:#111827;
    padding:30px;
    border-radius:20px;
    max-width:850px;
    margin:auto;
}

input{
    width:100%;
    padding:18px;
    background:#1f2937;
    border:none;
    border-radius:12px;
    color:white;
    font-size:18px;
}

input:focus{
    outline:none;
    box-shadow:0 0 12px rgba(124,58,237,.7);
}

.result{
    margin-top:25px;
    padding:25px;
    border-radius:15px;
    background:#1f2937;
    display:none;
}

.break{
    color:#22c55e;
    font-size:24px;
    font-weight:bold;
    margin:15px 0;
}

.badge{
    display:inline-block;
    background:#7c3aed;
    padding:8px 12px;
    border-radius:999px;
    margin:5px;
    font-size:14px;
}

.footer{
    margin-top:100px;
    text-align:center;
    color:#94a3b8;
    padding-bottom:50px;
}

.footer h3{
    margin-bottom:10px;
    color:white;
}

</style>
</head>

<body>

<div class="hero">
