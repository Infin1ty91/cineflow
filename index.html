<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineFlow | Never Miss an Important Scene</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Inter,Arial,sans-serif;
    background:linear-gradient(180deg,#07122c 0%,#0f172a 100%);
    color:white;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.hero{
    text-align:center;
    padding:80px 20px;
}

.logo{
    font-size:72px;
    margin-bottom:10px;
}

h1{
    font-size:68px;
    margin:0;
}

.subtitle{
    font-size:28px;
    color:#94a3b8;
    margin-top:20px;
}

.description{
    max-width:850px;
    margin:40px auto;
    font-size:20px;
    line-height:1.8;
    color:#dbeafe;
}

.section{
    margin-top:90px;
}

.section h2{
    text-align:center;
    font-size:38px;
    margin-bottom:40px;
}

.features{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#111827;
    padding:25px;
    border-radius:16px;
    text-align:center;
    transition:0.2s;
}

.card:hover{
    transform:translateY(-3px);
}

.search-box{
    background:#111827;
    padding:35px;
    border-radius:20px;
    max-width:800px;
    margin:auto;
}

input{
    width:100%;
    padding:18px;
    border:none;
    border-radius:12px;
    background:#1f2937;
    color:white;
    font-size:18px;
}

input:focus{
    outline:none;
    box-shadow:0 0 15px rgba(124,58,237,0.5);
}

.result{
    margin-top:25px;
    background:#1f2937;
    border-radius:14px;
    padding:25px;
    display:none;
}

.breaktime{
    color:#22c55e;
    font-weight:bold;
    font-size:24px;
}

.tag{
    display:inline-block;
    background:#7c3aed;
    padding:8px 12px;
    border-radius:999px;
    margin:5px;
    font-size:14px;
}

.footer{
    margin-top:100px;
    text-align:center;
    color:#94a3b8;
    padding-bottom:60px;
}

.footer h3{
    color:white;
}

@media(max-width:768px){

    h1{
        font-size:48px;
    }

    .logo{
        font-size:48px;
    }

    .subtitle{
        font-size:22px;
    }

    .description{
        font-size:18px;
    }
}

</style>
</head>
<body>

<div class="container">

<div class="hero">

<div class="logo">🎬</div>

<h1>CineFlow</h1>

<div class="subtitle">
Never miss an important scene again.
</div>

<div class="description">

CineFlow helps movie lovers find the safest moments to:

<br><br>

🚻 Use the restroom<br>
🍿 Refill snacks<br>
📞 Take a phone call<br>
🚬 Take a smoke break<br>
☕ Grab a coffee

<br><br>

Without missing major plot twists
